<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RouteOpt">
    <meta name="theme-color" content="#1a73e8">
    <title>Route Optimizer</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <h1>Route Optimizer</h1>
            <button id="settings-btn" class="icon-btn" aria-label="Settings">⚙️</button>
        </header>

        <!-- Settings Modal -->
        <div id="settings-modal" class="modal hidden">
            <div class="modal-content">
                <h2>Settings</h2>
                <label for="api-key-input">Google Maps API Key</label>
                <input type="password" id="api-key-input" placeholder="Enter your API key">
                <p class="hint">Get a free key at <a href="https://console.cloud.google.com/" target="_blank">Google Cloud Console</a></p>
                <div class="modal-actions">
                    <button id="save-key-btn" class="btn btn-primary">Save</button>
                    <button id="cancel-settings-btn" class="btn btn-secondary">Cancel</button>
                </div>
            </div>
        </div>

        <!-- Address Input Section -->
        <section class="address-section">
            <div class="start-location">
                <div class="input-row">
                    <span class="marker start-marker">🟢</span>
                    <input type="text" id="start-input" placeholder="Start location" autocomplete="new-password">
                    <button id="gps-btn" class="icon-btn" aria-label="Use GPS">🎯</button>
                </div>
            </div>

            <div class="end-location">
                <div class="input-row">
                    <span class="marker end-marker">🔴</span>
                    <input type="text" id="end-input" placeholder="End location" autocomplete="new-password">
                </div>
            </div>

            <div id="stops-container">
                <!-- Stops will be added here dynamically -->
            </div>

            <button id="add-stop-btn" class="btn btn-add">+ Add Stop</button>
        </section>

        <!-- Optimize Button -->
        <button id="optimize-btn" class="btn btn-optimize" disabled>Optimize Route</button>

        <!-- Results Section -->
        <section id="results-section" class="results-section hidden">
            <h2>Optimized Route</h2>
            <div id="route-summary" class="route-summary"></div>
            <div id="route-steps" class="route-steps"></div>
            <div class="result-actions">
                <button id="navigate-btn" class="btn btn-navigate">Open in Google Maps</button>
                <button id="save-route-btn" class="btn btn-save">💾 Save Route</button>
            </div>
        </section>

        <!-- Saved Routes Section -->
        <section id="saved-routes-section" class="saved-routes-section">
            <div class="saved-header">
                <h2>Saved Routes</h2>
            </div>
            <div id="saved-routes-list" class="saved-routes-list">
                <p class="empty-state">No saved routes yet</p>
            </div>
        </section>

        <!-- Map Section -->
        <div id="map" class="map-container"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
